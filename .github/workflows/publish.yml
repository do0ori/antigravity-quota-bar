name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository

      - name: Publish to Open VSX Registry
        if: env.OVSX_TOKEN != ''
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_ACCESS_TOKEN }}
        run: npx ovsx publish -p "$OVSX_TOKEN"

      - name: Publish to VS Code Marketplace
        if: env.VSCODE_PAT != ''
        env:
          VSCODE_PAT: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
        run: npx @vscode/vsce publish -p "$VSCODE_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: '*.vsix'
          generate_release_notes: true
